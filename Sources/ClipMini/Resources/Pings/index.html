<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="overlay.css">
<style>#wheel{width:480px;height:480px;margin:0;transform:none;opacity:1}#wheel .centerTxt{font-family:-apple-system,sans-serif;font-size:16px}#wheel .backTxt{font-family:-apple-system,sans-serif;font-size:12px}#wheel .hub{clip-path:inset(0 round 8px);transition:filter .1s}#wheel .hub.center-hot{filter:drop-shadow(0 0 9px #ffc96c)}#wheel .core.center-hot{stroke:#ffe4a3;stroke-width:4}.heartsteel .pop{animation:steel-hit .45s ease-out both, bob 1.6s ease-in-out .45s infinite}.heartsteel .art img{border-radius:14px}.heartsteel .steel-label{position:absolute;left:0;top:62px;transform:translateX(-50%);white-space:nowrap;color:#ffe1a0;font:600 16px -apple-system;text-shadow:0 0 12px #df8e27;animation:life 1.8s linear forwards}@keyframes steel-hit{0%{transform:scale(1.65);opacity:0}25%{transform:scale(.83);opacity:1}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.charge-ring{transition:opacity .12s;filter:drop-shadow(0 0 4px #ffce76)}.remote-label{position:absolute;top:72px;left:0;transform:translateX(-50%);white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;background:#101a26dd;color:#fff;border:1px solid #b99a5e;border-radius:8px;padding:5px 12px;font:13px -apple-system}</style>
<svg id="wheel" viewBox="-300 -300 600 600"></svg><div id="pings"></div><script>
const defs=[['危险','pingwheel_retreatrender',['pingwheel_retreatrender'],'SRP_12','#ff3b55'],['推进','push',['pingwheel_pushrender'],'SRP_9','#35d27a'],['正在路上','omw',['omw'],'OnMyWay','#2e8bff'],['全力进攻','all_in',['pingwheel_allin_render_01','pingwheel_allin_render_02'],'SRP_4','#f2b320'],['请求支援','assist_me',['assist_me'],'ComeHere','#56d43c'],['需要视野','need_vision',['need_vision'],'SRP_7','#56d43c'],['敌人消失','enemy_missing',['enemy_missing'],'MIA','#f2c518'],['敌方视野','pingwheel_enemyvisionrender',['pingwheel_enemyvisionrender'],'AreaIsWarded','#ff3b55']];
const WHEEL={size:600,innerR:86,outerR:188,extR:288,iconR:137,iconSize:48};
const WHEEL_SLOTS=8, wedges=[],icons=[];
function el(tag,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));parent.append(e);return e}
const polar=(r,deg)=>[r*Math.cos(deg*Math.PI/180),r*Math.sin(deg*Math.PI/180)];
function sector(r0,r1,a0,a1){const [x0,y0]=polar(r0,a0),[x1,y1]=polar(r1,a0),[x2,y2]=polar(r1,a1),[x3,y3]=polar(r0,a1);return `M${x0},${y0} L${x1},${y1} A${r1},${r1} 0 0 1 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 0 0 ${x0},${y0}Z`}
function build(){
    const { innerR, outerR, extR, iconR, iconSize } = WHEEL;
    const svg = document.getElementById("wheel");
    const id = `lp-${svg.id}`;
    el('defs', {}, svg).innerHTML = `
      <radialGradient id="${id}-ext" cx="0" cy="0" r="${extR}" gradientUnits="userSpaceOnUse">
        <stop offset="${outerR / extR}" stop-color="#5c6066" stop-opacity=".55"/><stop offset="1" stop-color="#5c6066" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}-ring" cx="0" cy="0" r="${outerR}" gradientUnits="userSpaceOnUse">
        <stop offset="${innerR / outerR}" stop-color="#2a2d31"/><stop offset="1" stop-color="#4a4e54"/></radialGradient>
      <radialGradient id="${id}-hot" cx="0" cy="0" r="${extR}" gradientUnits="userSpaceOnUse">
        <stop offset="${innerR / extR}" stop-color="#8a8f96"/><stop offset="${outerR / extR}" stop-color="#9aa0a8"/>
        <stop offset="1" stop-color="#9aa0a8" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}-core" cx="0" cy="-10" r="${innerR}" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2c5d60"/><stop offset="1" stop-color="#11292c"/></radialGradient>`;

    const slots = [...Array(WHEEL_SLOTS).keys()];
    el('circle', { r: (innerR + outerR) / 2, fill: 'none', stroke: `url(#${id}-ring)`, 'stroke-width': outerR - innerR, opacity: 0.92 }, svg);
    slots.forEach((i) => {
      const mid = -90 + i * 45;
      const reach = outerR;
      wedges.push(el('path', { d: sector(innerR, reach, mid - 22.5, mid + 22.5), fill: `url(#${id}-hot)`, 'fill-opacity': 0, class: 'wedge' }, svg));
      const [x0, y0] = polar(innerR, mid - 22.5);
      const [x1, y1] = polar(outerR, mid - 22.5);
      el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: '#a08a5c', 'stroke-opacity': 0.45, 'stroke-width': 1.2 }, svg);
    });
    slots.forEach((i) => {
      const [ix, iy] = polar(iconR, -90 + i * 45);
      icons.push(el('image', { x: ix - iconSize / 2, y: iy - iconSize / 2, width: iconSize, height: iconSize, class: 'icon' }, svg));
    });

    el('circle', { r: innerR + 4, fill: 'none', stroke: '#1a1a1a', 'stroke-width': 6, opacity: 0.6 }, svg);
    el('circle', { r: innerR, class: "core", fill: `url(#${id}-core)`, stroke: '#c8aa6e', 'stroke-width': 3 }, svg);
    el('circle', { r: innerR - 7, fill: 'none', stroke: '#8a7448', 'stroke-width': 1, opacity: 0.6 }, svg);
    for(let n=1;n<=3;n++) el('circle',{r:innerR-30+n*8,fill:'none',stroke:'#ffd78b','stroke-width':2,opacity:0,class:'charge-ring'},svg);
    el('image', { href: "textures/heartsteel.png", x: -24, y: -64, width: 48, height: 48, class: 'hub' }, svg);
    el('text', { x: 0, y: 6, 'text-anchor': 'middle', class: 'centerTxt' }, svg).textContent = "心之钢";
    el('text', { x: 0, y: 33, 'text-anchor': 'middle', class: 'backTxt' }, svg).textContent = '停留蓄力';
    el('text', { x: 0, y: 52, 'text-anchor': 'middle', class: 'backTxt' }, svg).textContent = '松开取消';
}

build();
icons.forEach((icon,i)=>icon.setAttribute('href','textures/'+defs[i][1]+'.png'));
function select(i){wedges.forEach((w,n)=>w.setAttribute('fill-opacity',n===i?'.55':'0'));icons.forEach((icon,n)=>icon.classList.toggle('hot',n===i));document.querySelector('.centerTxt').textContent=i<0?'心之钢':defs[i][0];document.querySelector('.hub').classList.toggle('center-hot',i<0);document.querySelector('.core').classList.toggle('center-hot',i<0)}
function reset(){wheel.style.display='block';pings.replaceChildren();select(-1);charge(0)}
function charge(stage){document.querySelectorAll('.charge-ring').forEach((r,i)=>r.setAttribute('opacity',i<stage?'1':'0'));document.querySelector('.backTxt').textContent=stage===3?'已蓄满 · 点击叠钢':stage>0?'蓄力 '+stage+'/3':'停留蓄力'}
function ping(i,x=240,y=240){wheel.style.display='none';let d=defs[i],r=document.createElement('div');r.className='ping';r.style.cssText='left:'+x+'px;top:'+y+'px;--c:'+d[4]+';--size:110px;--dur:3.2s';r.innerHTML='<div class="ground"></div><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="art">'+(d[2].length===2?'<div class="clash">'+d[2].map((n,j)=>'<img class="a'+(j+1)+'" src="textures/'+n+'.png">').join('')+'</div><div class="flash"></div>':'<div class="pop"><img src="textures/'+d[2][0]+'.png"></div>')+'</div>';while(pings.childElementCount>=30)pings.firstElementChild.remove();pings.append(r);setTimeout(()=>r.remove(),3400);return r}

function heartsteel(x=240,y=240,count=0){wheel.style.display='none';const r=document.createElement('div');r.className='ping heartsteel';r.style.cssText='left:'+x+'px;top:'+y+'px;--c:#efbb63;--size:96px;--dur:1.8s';r.innerHTML='<div class="ground"></div><div class="ring"></div><div class="ring r2"></div><div class="art"><div class="pop"><img src="textures/heartsteel.png"></div><div class="flash"></div></div><div class="steel-label">铛！心之钢 ×'+count+'</div>';while(pings.childElementCount>=30)pings.firstElementChild.remove();pings.append(r);setTimeout(()=>r.remove(),1800);return r}
function remotePing(index,name,x=240,y=240,count=0){const r=index===8?heartsteel(x,y,count):ping(index,x,y);if(index===8)r.querySelector('.steel-label')?.remove();const tag=document.createElement('div');tag.className='remote-label';tag.textContent=name+' · '+(index===8?'心之钢 ×'+count:defs[index][0]);r.append(tag)}
</script>
